<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>數碼鴻溝體驗遊戲:基層長者的一天</title>
<style>
body{font-family:"Microsoft JhengHei","PingFang HK",sans-serif;margin:0;background:#f4f1ea;color:#222}
#app{max-width:640px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px #0002;margin-bottom:12px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;background:#2b6cb0;color:#fff}
.bar{height:14px;background:#ddd;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%}
.r1 .q{font-size:13px}.r1 .opt{font-size:11px;padding:4px 6px;margin:3px;background:#888}
.r2 .q{font-size:24px;line-height:1.5}.r2 .opt{display:block;width:100%;font-size:22px;padding:16px;margin:10px 0}
.hint{background:#fff6d6;border-left:6px solid #e0a800;padding:10px;margin-top:10px;font-size:20px}
.phone{background:#eee;border:2px solid #444;border-radius:16px;padding:12px;margin:8px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:#ddd;font-size:13px}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:center}
.big{font-size:18px;padding:12px 20px}
</style></head><body><div id="app"></div>
<script>
const S=[
{dim:"身體層面",ctx:"醫管局「藥物送遞服務」要用App核對二維碼(QR Code)。",q:"你要出示核對用二維碼,應該按哪一項?",
 o:["設定","我的二維碼(核對用)","登出","常見問題"],a:1,h:"二維碼通常放在「我的」或「訂單」入面。教練會陪你逐步按,按錯可以返回。"},
{dim:"心理層面",ctx:"你收到一個短訊:「你的醫療券戶口異常,請即點擊連結更新資料,否則今日凍結。」",q:"你應該點做?",
 o:["立即點擊連結,輸入資料","先暫停,不點擊,並致電「防騙易18222」或問職員","回覆短訊問對方是誰","把驗證碼傳給對方"],a:1,h:"三步:停一停、不點擊、循可靠渠道求證。遇到可疑訊息,問人唔係蠢。"},
{dim:"社區層面",ctx:"中心改用通訊群組發放活動訊息,你只懂睇、未學過回覆。你想報名長者旅行。",q:"你可以點樣報名?",
 o:["放棄,反正我唔識","學識回覆,或致電中心/問「長者數碼支援站」","等人幫我報,唔問人","叫陌生人代按"],a:1,h:"科技應擴闊選擇,而唔係唯一入場條件。你可以打電話,或去支援站學一次。"},
{dim:"經濟層面",ctx:"你主要用手機打電話、收發文字訊息,偶然睇相。電訊店推銷「長者優惠」月費合約,大流量,要簽約。",q:"你點樣揀較合適?",
 o:["見到「長者優惠」就簽","比較自己真正用量,考慮低用量或儲值方案,睇清楚終止合約費用","揀最貴,一定最好","唔問條款,先簽再算"],a:1,h:"唔好只睇「長者優惠」四個字。先問自己用咩,再比較價錢同合約條款。"}
];
const app=document.getElementById("app");
let round=1,i=0,st={};
function reset(){st={1:{score:0,wrong:0,timeout:0,quit:0},2:{score:0,wrong:0,timeout:0,quit:0}}}
reset();
let timer=null,left=0,tries=0;
function intro(){
 app.innerHTML=`<div class="card"><h2>📱 數碼鴻溝體驗:一日基層長者</h2>
 <p>你會扮演一位基層長者,處理 4 個日常數碼情境。同一批情境會玩兩次:</p>
 <p><b>第一輪「現況」</b>:字細、時間短、冇人幫手。<br><b>第二輪「改善後」</b>:套用我們小組的建議,包括大字體及大按鈕、延長時間、青年數碼教練陪伴、模擬防騙練習和非數碼渠道。</p>
 <p>最後比較兩輪的分數、焦慮感和信心。</p>
 <p style="font-size:13px;color:#666">本遊戲只為教學模擬,不收集任何個人資料。情境為虛構,題目內容依小組匯報建議設計。</p>
 <button class="big" onclick="startRound(1)">開始第一輪</button></div>`}
function startRound(r){round=r;i=0;scene()}
function scene(){
 clearInterval(timer);tries=0;
 if(i>=S.length){return round==1?between():end()}
 const s=S[i],r=round;left=r==1?12:45;
 app.innerHTML=`<div class="${r==1?'r1':'r2'}"><div class="card">
 <span class="tag">${r==1?"第一輪:現況":"第二輪:改善後"}</span> <span class="tag">${s.dim}</span> <span class="tag">${i+1}/${S.length}</span>
 <div class="bar" style="margin:10px 0"><i id="tb" style="width:100%;background:${r==1?'#c53030':'#2f855a'}"></i></div>
 <div id="tt">⏱ ${left} 秒</div>
 <p class="q">${s.ctx}</p><div class="phone"><p class="q"><b>${s.q}</b></p><div id="opts"></div></div>
 <div id="fb"></div>
 ${r==2?'<button class="big" id="hb" onclick="hint()">🧑‍🏫 問數碼教練</button> <button class="big" style="background:#718096" onclick="ext()">⏱ 要多啲時間</button>':''}
 </div></div>`;
 const o=document.getElementById("opts");
 s.o.map((t,k)=>[t,k]).sort(()=>Math.random()-.5).forEach(([t,k])=>{
  const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(k,b);o.appendChild(b)});
 const total=left;
 timer=setInterval(()=>{left--;
  document.getElementById("tb").style.width=Math.max(0,left/total*100)+"%";
  document.getElementById("tt").textContent="⏱ "+Math.max(left,0)+" 秒"+(round==2&&left<=10&&left>0?"(提示:你可以按「要多啲時間」)":"");
  if(left<=0){clearInterval(timer);st[round].timeout++;st[round].wrong++;
   fb(round==1?"⌛ 時間到,畫面已重設,你冇完成。你開始擔心:「我係咪好笨?」":"",round==1)}
 },1000)}
function hint(){document.getElementById("fb").innerHTML=`<div class="hint">🧑‍🏫 ${S[i].h}</div>`}
function ext(){left+=30;}
function pick(k,b){
 if(k==S[i].a){clearInterval(timer);
  const pts=round==2&&tries==0?(document.querySelector(".hint")?2:3):round==2?1:3;
  st[round].score+=round==1?3:pts;
  fb(round==1?"✅ 做到了!但一直好緊張。":"✅ 做得好!有支援,你成功完成。",true)}
 else{st[round].wrong++;tries++;
  if(round==1){clearInterval(timer);fb("❌ 按錯了,資料已重設,冇人幫你。你開始怕再按錯。",true)}
  else{b.disabled=true;b.style.background="#aaa";
   document.getElementById("fb").innerHTML=`<div class="hint">按錯唔緊要,再試一次。可以問教練。</div>`}}}
function fb(msg,show){
 clearInterval(timer);
 if(round==1&&msg.startsWith("❌")||msg.startsWith("⌛")){}
 app.querySelector(".card").insertAdjacentHTML("beforeend",`<p class="q">${msg}</p><button class="big" onclick="i++;scene()">繼續</button>`);
 document.querySelectorAll(".opt").forEach(x=>x.disabled=true)}
function between(){
 app.innerHTML=`<div class="card"><h3>第一輪完成</h3>
 <p>你剛才體驗到:字細、時間緊迫、冇人幫手、做錯要重來。</p>
 <p><b>討論一下:</b>你感覺如何?哪一刻最想放棄?</p>
 <p>現在進入第二輪:我們把小組建議放進去。</p>
 <button class="big" onclick="startRound(2)">開始第二輪(改善後)</button></div>`}
function metrics(r){const x=st[r];
 const anx=Math.min(100,20+x.wrong*(r==1?20:6)+x.timeout*10);
 const conf=Math.max(5,Math.min(100,(r==1?35:60)+x.score*(r==1?4:3)-x.wrong*(r==1?10:2)));
 return{anx,conf}}
function end(){
 const a=metrics(1),b=metrics(2);
 const row=(n,x,y,u)=>`<tr><td>${n}</td><td>${x}${u}</td><td>${y}${u}</td></tr>`;
 const bar=(v,c)=>`<div class="bar"><i style="width:${v}%;background:${c}"></i></div>`;
 app.innerHTML=`<div class="card"><h2>結果比較</h2>
 <table><tr><th></th><th>第一輪 現況</th><th>第二輪 改善後</th></tr>
 ${row("得分(滿分12)",st[1].score,st[2].score,"")}
 ${row("按錯/逾時次數",st[1].wrong,st[2].wrong,"")}
 ${row("逾時次數",st[1].timeout,st[2].timeout,"")}</table>
 <p>焦慮感(越低越好)</p>${bar(a.anx,"#c53030")}<small>第一輪 ${a.anx}</small>${bar(b.anx,"#c53030")}<small>第二輪 ${b.anx}</small>
 <p>使用信心(越高越好)</p>${bar(a.conf,"#2f855a")}<small>第一輪 ${a.conf}</small>${bar(b.conf,"#2f855a")}<small>第二輪 ${b.conf}</small>
 <p style="font-size:12px;color:#666">焦慮和信心為遊戲模擬指數,只用作教學示範,不代表真實測量或臨床評估。</p></div>
 <div class="card"><h3>我們的改善建議如何起作用</h3>
 <p>🔹 <b>身體</b>:大字體、大按鈕、延長操作時間、逾時提醒<br>
 🔹 <b>心理</b>:青年數碼教練陪伴、模擬防騙情境、做錯唔緊要<br>
 🔹 <b>社區</b>:長者數碼支援站、保留電話等非數碼渠道<br>
 🔹 <b>經濟</b>:精明電訊消費教育、數據資助</p>
 <p><b>反思問題:</b>1. 兩輪最大分別是什麼?2. 哪項改善對你最有用?3. 仍有哪些長者可能被遺漏?</p>
 <button class="big" onclick="reset();intro()">重新玩</button></div>`}
intro();
</script></body></html>
